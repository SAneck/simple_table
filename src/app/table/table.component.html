<table>
	<thead>
		<tr>
			<th scope="col">ID</th>
			<th scope="col">SecondName
				<button (click)="changeSortIcon(); sortContent(TaskField.SecondName)">
					<img [class.img__sort__down]="sortPosition === true">
					<img [class.img__sort__up]="sortPosition === false">
				</button>
			</th>
			<th scope="col">Firstname
				<button (click)="changeSortIcon(); sortContent(TaskField.FirstName)">
					<img [class.img__sort__down]="sortPosition === true">
					<img [class.img__sort__up]="sortPosition === false">
				</button>
			</th>
			<th scope="col">Content 
				<button (click)="changeSortIcon(); sortContent(TaskField.Content)">
					<img [class.img__sort__down]="sortPosition === true">
					<img [class.img__sort__up]="sortPosition === false">
				</button>
			</th>
			<th scope="col">Data</th>
		</tr>
	</thead>
	<tbody>
		<tr *ngFor="let task of tasks$ | async; let index = index">
			<th scope="row" data-label="ID">{{ index }}</th>
			<td data-label="Firstname">{{ task.firstName }}</td>
			<td data-label="SecondName">{{ task.secondName }}</td>
			<td data-label="Content">{{ task.content }}</td>
			<td data-label="Date">{{ task.date | date : 'dd/MM/yyyy' }}</td>
		</tr>
	</tbody>
	<tfoot>
		<tr>
			<th scope="row" colspan="2">
				<span *ngFor="let task of pagination$ | async; let index = index">
                	{{index}} 
            	</span>
				<!-- All tasks {{ numbersOfTasks$ | async }} -->
			</th>
		</tr>
	</tfoot>
</table>
